<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 450px; margin: 50px auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 16px; cursor: pointer; }
    .error { color: #d93025; margin-top: 10px; font-weight: bold; }
    .success { color: #188038; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Contact Us</h2>
  <form id="contactForm" novalidate>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your Name">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="Your Message"></textarea>
    </div>
    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <div id="feedback" role="alert"></div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      const feedback = document.getElementById('feedback');

      if (!name || !email || !message) {
        feedback.className = 'error';
        feedback.textContent = 'All fields are required. Please fill out empty fields.';
        return;
      }

      feedback.className = 'success';
      feedback.textContent = 'Thank you! Your message has been sent successfully.';
      this.reset();
    });
  </script>
</body>
</html>
